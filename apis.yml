name: Axcelius I/II
description: >-
  Axcelius I/II is a biopharmaceutical company-creation vehicle backed by Canaan Partners, formed to
  found and incubate drug-development companies pursuing treatments for cancer, rare diseases, and
  neurodegenerative disorders. It is led by managing partner Dennis Podlesak and sponsored at Canaan
  by general partner Brent Ahrens, and operates from San Francisco, California, with an associated
  holding entity registered in Connecticut at Canaan's Westport office. Rather than operating as a
  product company, Axcelius assembles management teams and capital around licensed therapeutic assets
  and spins them out as standalone biopharma companies; Transposon Therapeutics, developing therapies
  for ALS and Alzheimer's disease, is its best-documented creation. As of this enrichment pass the
  vehicle remains in stealth mode with no public developer surface -- no product website beyond a
  holding page, no documentation, developer portal, SDKs, GitHub organization, or API of any kind.
